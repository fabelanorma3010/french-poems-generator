<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <link rel="stylesheet" href="src/style.css" />
    <title>My Poem Generator</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>My Poem Generator</h1>
      </header>

      <main>
        <form id="poem-generator-form">
          <input
            type="text"
            placeholder="Enter poem"
            autofocus
            required
            autocomplete="off"
            class="instructions"
          />
          <input type="submit" class="submit-button" />
        </form>
        <div class="poem" id="poem"></div>
      </main>

      <footer>
        This AI project was coded by
        <a href="https://github.com/matthieua/" target="_blank">Norma Fabela</a>
        and is
        <a href="target" ="_blank"> open-sourced on GitHub</a>
        and is
        <a href="">hosted on vercel</a>.
      </footer>
      >.
    </div>

    <script src="src/index.js"></script>
  </body>
</html>
